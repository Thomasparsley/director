name: Release

on:
  push:
    tags:
      # GitHub tag filters are globs, not regular expressions: `+` means "one or
      # more of the preceding character", so this matches v0.1.0 and v1.12.10
      # alike. Written as `v[0-9].[0-9].[0-9]` it would stop matching at v0.10.0.
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ancestry check below needs real history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # A tag is just a pointer, and one can be pushed from any branch. Publishing
      # cannot be undone after 72 hours, so refuse a tag whose commit never landed
      # on main.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - run: pnpm install --frozen-lockfile

      # `pnpm version-packages` has to run *before* tagging. A leftover changeset
      # means the manifests still carry the previous versions — the publish would
      # be a silent no-op, or would ship versions no changelog describes.
      - name: Verify no changesets are pending
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending unreleased changeset(s) — run 'pnpm version-packages', commit, then re-tag"
            exit 1
          fi

      # The packages ship raw source (ADR-0001), so there is nothing to build. CI
      # already gated this commit on main; re-running the cheap checks here means a
      # release never depends on that having happened.
      - run: pnpm typecheck
      - run: pnpm test

      # `setup-node` puts its auth in an .npmrc it points at with NPM_CONFIG_USERCONFIG,
      # which pnpm does not reliably read — and an unauthenticated scoped publish comes
      # back from npm as a bare 404. Write the token into the project .npmrc, where pnpm
      # is certain to find it. The value stays an env reference rather than the secret
      # itself: npm expands `${...}` when it reads the file, so the token never lands on
      # disk.
      - name: Authenticate to npm
        run: echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc

      # Fail here, loudly, rather than inside `changeset publish` — which reports a bad
      # token as `TypeError: Cannot read properties of undefined (reading 'includes')`,
      # having crashed in the handler that was trying to read npm's error. That masked
      # the real failure on the first v0.1.0 attempt.
      - name: Verify npm authentication
        run: pnpm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `whoami` proves the token is valid; it proves nothing about whether this token may
      # publish to this scope. A granular token restricted to "only select packages"
      # cannot create the first package in an empty scope — there was nothing to select
      # when it was minted — and npm reports that as a 404, which changesets then eats.
      - name: Diagnose the token's access to @directorkit
        run: |
          echo "authenticated as: $(npm whoami)"
          npm access list packages @directorkit \
            || echo "::warning::cannot list @directorkit — the token has no scope-level access"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # changesets renders *every* publish failure as `TypeError: ... reading 'includes'`,
      # crashing in the handler that was meant to read npm's error, so the actual message
      # never reaches the log. Publish one package directly first — same credentials, same
      # flags, but npm's own stderr is visible. `@directorkit/common` is the right probe:
      # it sits at the root of the chain and depends on no other @directorkit package.
      # If it succeeds, the `pnpm release` below simply skips it, since that publishes
      # only what the registry does not already have.
      - name: Publish one package directly, for a readable error
        run: pnpm --filter @directorkit/common publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Publishes every package whose version is not already on the registry and
      # skips the rest — so a tag that bumped one layer publishes one package.
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # pnpm has no --provenance flag; it shells out to the npm CLI, which
          # reads this. Needs the id-token permission above.
          NPM_CONFIG_PROVENANCE: "true"
