name: Release

on:
  push:
    tags:
      # GitHub tag filters are globs, not regular expressions: `+` means "one or
      # more of the preceding character", so this matches v0.1.0 and v1.12.10
      # alike. Written as `v[0-9].[0-9].[0-9]` it would stop matching at v0.10.0.
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ancestry check below needs real history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # A tag is just a pointer, and one can be pushed from any branch. Publishing
      # cannot be undone after 72 hours, so refuse a tag whose commit never landed
      # on main.
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }

      - run: pnpm install --frozen-lockfile

      # `pnpm version-packages` has to run *before* tagging. A leftover changeset
      # means the manifests still carry the previous versions — the publish would
      # be a silent no-op, or would ship versions no changelog describes.
      - name: Verify no changesets are pending
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" -ne 0 ]; then
            echo "::error::$pending unreleased changeset(s) — run 'pnpm version-packages', commit, then re-tag"
            exit 1
          fi

      # The packages ship raw source (ADR-0001), so there is nothing to build. CI
      # already gated this commit on main; re-running the cheap checks here means a
      # release never depends on that having happened.
      - run: pnpm typecheck
      - run: pnpm test

      # Auth comes from `setup-node`, which writes an .npmrc and points NPM_CONFIG_USERCONFIG
      # at it. v0.1.0 also wrote the token into the *project* .npmrc on the theory that pnpm
      # ignored setup-node's copy; pnpm refused to read it ("environment variables are not
      # expanded in registry credentials that come from a project .npmrc, because that file
      # is committed to the repository") and published fine regardless. Don't add it back.

      # Fail here, loudly, rather than inside `changeset publish` — which reports a bad
      # token as `TypeError: Cannot read properties of undefined (reading 'includes')`,
      # having crashed in the handler that was trying to read npm's error. That masked
      # the real failure on the first v0.1.0 attempt.
      - name: Verify npm authentication
        run: pnpm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Provenance goes in the npmrc, because neither earlier attempt could have worked.
      # v0.1.0 set NPM_CONFIG_PROVENANCE on the publish step, believing pnpm forwards it to
      # the npm CLI. v0.3.0 moved it into each package's `publishConfig`, believing pnpm
      # reads it there. It does not: pnpm's `createPublishOptions` reads exactly six
      # publishConfig keys — access, directory, executableFiles, linkDirectory, name and
      # registry — and takes `provenance` only from the config layer. `publishConfig.provenance`
      # is therefore inert under pnpm, and v0.3.0 shipped all three packages unattested in
      # exactly the way v0.1.0 had. The key is still correct for the npm CLI; it is kept so a
      # publish run outside pnpm attests, and it is not what makes this workflow attest.
      #
      # `changeset publish` spawns `pnpm publish --access … --tag … --no-git-checks` with a
      # fixed flag list and no way to append to it, so pnpm's `--provenance` flag is out of
      # reach here — it is accepted by 11.20, despite being absent from `publish --help`.
      # What is in reach is the rc layer: "provenance" is listed in pnpm's `rcOptionsTypes`
      # for publish, so an npmrc entry reaches the same option the flag would set. It goes
      # into setup-node's npmrc — the file pnpm demonstrably reads, since the token in it is
      # what makes `pnpm whoami` above succeed — and not into the committed project .npmrc,
      # which would also make every local publish try to attest and fail.
      #
      # The `id-token: write` permission above is what makes the OIDC exchange possible; a
      # local `pnpm release` has no such token and still publishes unattested, by design.
      - name: Turn provenance on for pnpm
        run: |
          test -n "$NPM_CONFIG_USERCONFIG" \
            || { echo "::error::NPM_CONFIG_USERCONFIG is unset — setup-node wrote no npmrc for pnpm to read"; exit 1; }
          echo "provenance=true" >> "$NPM_CONFIG_USERCONFIG"

      # Publishes every package whose version is not already on the registry and
      # skips the rest — so a tag that bumped one layer publishes one package.
      #
      # Nothing may publish to this scope *before* this step. changesets decides what to
      # skip from an `npm info` sweep it runs at the start, and the registry is
      # read-after-write inconsistent: during v0.1.0 a package published seconds earlier
      # still came back 404, so changesets published it a second time. npm rejected the
      # duplicate, and `isAlreadyPublishedError` — the handler whose whole purpose is to
      # absorb that rejection — crashed on the error object pnpm hands it
      # (`Cannot read properties of undefined (reading 'includes')`), aborting the run
      # with five packages still unpublished. Every publish failure looks like that
      # TypeError, so treat one as "read the registry, not the stack trace".
      - name: Publish
        run: |
          set -o pipefail
          pnpm release | tee /tmp/publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Assume nothing: read the attestations back off the registry. Twice now a release has
      # reported "packages published successfully" and shipped unattested, and both times it
      # was this check — run by hand, after the fact — that noticed. Running it here is what
      # stops a third time.
      #
      # It has to poll. The registry is read-after-write inconsistent (see above): during
      # v0.3.0 `identity` 404ed for roughly three minutes after the publish that created it,
      # while `dialogs` from the same run was already readable.
      - name: Verify provenance landed
        run: |
          published=$(grep -oE '@directorkit/[a-z-]+@[0-9]+\.[0-9]+\.[0-9]+' /tmp/publish.log | sort -u)
          if [ -z "$published" ]; then
            echo "Nothing was published — no attestations to check."
            exit 0
          fi
          # A `while read` loop here would run in a subshell, where `exit 1` fails only the
          # subshell and the step still passes green. That is the failure mode this whole
          # step exists to catch, so the loop is a `for`.
          for pkg in $published; do
            name=${pkg%@*}
            version=${pkg##*@}
            body=""
            for attempt in $(seq 1 20); do
              if body=$(curl -sf "https://registry.npmjs.org/$name/$version"); then
                break
              fi
              echo "$pkg is not readable on the registry yet (attempt $attempt)"
              sleep 20
            done
            if [ -z "$body" ]; then
              echo "::error::$pkg never became readable on the registry"
              exit 1
            fi
            printf '%s' "$body" | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                const attestations = JSON.parse(s).dist?.attestations;
                if (!attestations) {
                  console.log(`::error::${process.argv[1]} published without provenance attestations`);
                  process.exit(1);
                }
                console.log(`${process.argv[1]} is attested: ${attestations.url ?? "present"}`);
              });
            ' "$pkg"
          done
